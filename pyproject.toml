[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betbrain"
version = "0.1.0"
description = "A rigorously backtested ML football prediction engine (research tool; no guarantees)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "requests>=2.31",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
betbrain = "betbrain.cli:main"

[tool.setuptools]
packages = ["betbrain", "betbrain.providers"]
